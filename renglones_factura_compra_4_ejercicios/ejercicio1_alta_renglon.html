<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Alta de Renglón de Factura</title><style>
:root{--bg:#101318;--panel:#191e27;--panel2:#222936;--accent:#4da3ff;--text:#f2f4f7;--muted:#aab3c2;--border:#343c4a}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#0e1116,#1a202b);color:var(--text)}
header{padding:28px 20px;text-align:center;background:#151a22;border-bottom:1px solid var(--border)}
h1{margin:0 0 8px;font-size:28px}.subtitle{color:var(--muted)}
main{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:0 10px 30px #0005}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}
label{display:block;margin-bottom:7px;color:#dce2eb;font-weight:bold}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
button,a.btn{border:0;border-radius:8px;padding:11px 16px;background:var(--accent);color:#07111d;font-weight:bold;cursor:pointer;text-decoration:none}
button.secondary,a.secondary{background:#303846;color:var(--text)}button:hover,a.btn:hover{filter:brightness(1.12)}
.table-wrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left}th{background:#252c38;color:#dfe7f2}tr:hover td{background:#1e2530}
.modal-bg{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-bg.active{display:flex}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px}
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.home a{display:block;padding:24px;background:var(--panel);border:1px solid var(--border);border-radius:14px;color:var(--text);text-decoration:none}.home a:hover{border-color:var(--accent);transform:translateY(-2px)}small{color:var(--muted)}
@media(max-width:700px){.grid,.home{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header><h1>Alta de Renglón de Factura</h1><div class="subtitle">Gestión de renglones de factura de compra</div></header><main><div class="card"><form id="form"><div class="grid">
<div><label>NroFactura</label><input id="factura" required></div>
<div><label>Cod-Prod</label><input id="producto" required></div>
<div class="full"><label>Descripción producto-servicio</label><input id="descripcion" required></div>
<div><label>Unidad de medida</label><select id="unidad" required><option value="">Seleccione...</option></select></div>
<div><label>Cantidad</label><input id="cantidad" type="number" min="0" step="0.01" required></div>
<div><label>PrecioUnit</label><input id="precio" type="number" min="0" step="0.01" required></div>
<div><label>TotalRenglon</label><input id="total" readonly></div>
<div><label>PdfComprobante</label><input id="pdf" type="file" accept=".pdf"></div>
</div><div class="actions"><button type="submit">Guardar renglón</button></div></form></div></main><script>const unidades=[
{"codUni":"LT","descripcion":"Lt"},
{"codUni":"B30","descripcion":"bls30kg"},
{"codUni":"B20","descripcion":"bls20kg"},
{"codUni":"C2","descripcion":"caja2lts"}
];
const sel=document.getElementById('unidad');
unidades.forEach(u=>{const o=document.createElement('option');o.value=u.codUni;o.textContent=u.codUni+' - '+u.descripcion;sel.appendChild(o)});
function calcular(){document.getElementById('total').value=((+cantidad.value||0)*(+precio.value||0)).toFixed(2)}
cantidad.addEventListener('input',calcular);precio.addEventListener('input',calcular);
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();if(e.target.checkValidity())alert('Renglón guardado correctamente');else e.target.reportValidity()});</script></body></html>
