<!DOCTYPE html>
<html lang="es">

<head>

    <title>Lectura de formularios</title>
    <link rel="stylesheet" href="style.css">

<body>

    <header>
        <div class="wrap">
            <h1>Ejercicio 05 - Formularios</h1>

    <main class="wrap">

        <a class="back" href="../index.php">← Volver al indice</a>

        <section>

            <p>
                Formulario HTML enviado al PHP que figura en el atributo

            </p>

            <form action="respuesta.php" method="post">

                <label for="id_usuario">ID de usuario</label>
                <input type="text" id="id_usuario" name="id_usuario" required>

                <label for="contrasena">Contraseña</label>
                <input type="text" id="contrasena" name="contrasena" required>

                <button type="submit">Enviar formulario</button>

            </form>

        </section>

    </main>
