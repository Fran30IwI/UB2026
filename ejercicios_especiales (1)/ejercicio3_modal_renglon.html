<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal de Renglón de Factura</title>
    <style>

        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #101318; color: #f2f4f7; }
        header { padding: 30px 20px; text-align: center; background: #191e27; border-bottom: 1px solid #343c4a; }
        h1 { margin: 0 0 8px; }
        .subtitulo { color: #aab3c2; }
        main { max-width: 1100px; margin: 35px auto; padding: 0 20px; }
        .card { background: #191e27; padding: 25px; border: 1px solid #343c4a; border-radius: 14px; }
        .explicacion { color: #aab3c2; line-height: 1.5; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .completo { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 7px; font-weight: bold; }
        input, select { width: 100%; padding: 11px; border: 1px solid #343c4a; border-radius: 8px; background: #222936; color: white; }
        input:focus, select:focus { outline: none; border-color: #4da3ff; }
        .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        button, .boton { padding: 11px 16px; border: none; border-radius: 8px; background: #4da3ff; color: #07111d; font-weight: bold; cursor: pointer; text-decoration: none; }
        button.secundario, .boton.secundario { background: #303846; color: white; }
        button:hover, .boton:hover { filter: brightness(1.1); }
        .tabla { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; min-width: 850px; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #343c4a; text-align: left; }
        th { background: #252c38; }
        tr:hover td { background: #1e2530; }
        .modal-fondo { display: none; position: fixed; inset: 0; background: #0009; align-items: center; justify-content: center; padding: 18px; z-index: 10; }
        .modal-fondo.activo { display: flex; }
        .modal { width: min(700px, 100%); max-height: 90vh; overflow: auto; background: #191e27; border: 1px solid #343c4a; border-radius: 14px; padding: 25px; }
        .inicio { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .inicio a { display: block; padding: 24px; background: #191e27; border: 1px solid #343c4a; border-radius: 14px; color: white; text-decoration: none; }
        .inicio a:hover { border-color: #4da3ff; }
        small { color: #aab3c2; }
        @media (max-width: 700px) { .grid, .inicio { grid-template-columns: 1fr; } .completo { grid-column: auto; } }

    </style>
</head>
<body>
    <header>
        <h1>Modal de Renglón de Factura</h1>
        <div class="subtitulo">Alta de un renglón mediante una ventana modal</div>
    </header>

    <main>
        <section class="card">
            <p class="explicacion">
                El formulario se abre dentro de una ventana modal para cargar un nuevo renglón.
            </p>
            <button id="abrir">Nuevo renglón</button>
        </section>

        <div id="modalFondo" class="modal-fondo">
            <div class="modal">
                <h2>Nuevo Renglón</h2>

                <form id="formularioModal">
                    <div class="grid">
                        <div>
                            <label for="factura">NroFactura</label>
                            <input type="text" id="factura" required>
                        </div>

                        <div>
                            <label for="producto">Cod-Prod</label>
                            <input type="text" id="producto" required>
                        </div>

                        <div class="completo">
                            <label for="descripcion">Descripción producto-servicio</label>
                            <input type="text" id="descripcion" required>
                        </div>

                        <div>
                            <label for="unidad">Unidad de medida</label>
                            <select id="unidad" required>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>

                        <div>
                            <label for="cantidad">Cantidad</label>
                            <input type="number" id="cantidad" min="0" step="0.01" required>
                        </div>

                        <div>
                            <label for="precio">PrecioUnit</label>
                            <input type="number" id="precio" min="0" step="0.01" required>
                        </div>

                        <div>
                            <label for="total">TotalRenglon</label>
                            <input type="text" id="total" readonly>
                        </div>

                        <div>
                            <label for="pdf">PdfComprobante</label>
                            <input type="file" id="pdf" accept=".pdf">
                        </div>
                    </div>

                    <div class="acciones">
                        <button type="button" id="cerrar" class="secundario">Cerrar</button>
                        <button type="submit">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Unidades de medida disponibles.
        const unidades = [
    { codUni: "LT", descripcion: "Lt" },
    { codUni: "B30", descripcion: "bls30kg" },
    { codUni: "B20", descripcion: "bls20kg" },
    { codUni: "C2", descripcion: "caja2lts" }
];

        const modalFondo = document.getElementById("modalFondo");
        const selectUnidad = document.getElementById("unidad");

        // Cargamos las unidades en el select.
        unidades.forEach(function (unidad) {
            const opcion = document.createElement("option");
            opcion.value = unidad.codUni;
            opcion.textContent = unidad.codUni + " - " + unidad.descripcion;
            selectUnidad.appendChild(opcion);
        });

        // Abrir y cerrar el modal.
        document.getElementById("abrir").addEventListener("click", function () {
            modalFondo.classList.add("activo");
        });

        document.getElementById("cerrar").addEventListener("click", function () {
            modalFondo.classList.remove("activo");
        });

        // Calcular el total automáticamente.
        function calcularTotal() {
            const cantidad = Number(document.getElementById("cantidad").value) || 0;
            const precio = Number(document.getElementById("precio").value) || 0;

            document.getElementById("total").value = (cantidad * precio).toFixed(2);
        }

        document.getElementById("cantidad").addEventListener("input", calcularTotal);
        document.getElementById("precio").addEventListener("input", calcularTotal);

        // Validar y enviar el formulario.
        document.getElementById("formularioModal").addEventListener("submit", function (event) {
            event.preventDefault();

            if (this.checkValidity()) {
                alert("Renglón registrado correctamente");
                this.reset();
                document.getElementById("total").value = "";
                modalFondo.classList.remove("activo");
            } else {
                this.reportValidity();
            }
        });
    </script>
</body>
</html>
